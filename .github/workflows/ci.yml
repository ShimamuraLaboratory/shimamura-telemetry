name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: make test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} make build
          mv bin/shimamura-telemetry bin/shimamura-telemetry-linux-${{ matrix.goarch }}
      - name: Smoke test (amd64)
        if: matrix.goarch == 'amd64'
        run: ./bin/shimamura-telemetry-linux-amd64 version
      - uses: actions/upload-artifact@v4
        with:
          name: shimamura-telemetry-linux-${{ matrix.goarch }}
          path: bin/shimamura-telemetry-linux-${{ matrix.goarch }}
          retention-days: 7
