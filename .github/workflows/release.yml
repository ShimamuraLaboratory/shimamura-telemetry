# タグ（v0.1.0 など）を push すると、linux/amd64・linux/arm64 のバイナリをビルドしてリリースを作る。
#
# 添付するもの:
#   shimamura-telemetry-linux-amd64 / shimamura-telemetry-linux-arm64  バイナリ
#   checksums.txt                                                      上の SHA-256（install.sh が検証する）
#   install.sh                                                         インストールスクリプト
#
# 計算機サーバーは https://github.com/ShimamuraLaboratory/shimamura-telemetry/releases/latest/download/<ファイル名>
# から取得する（IdP の管理画面に表示するインストールコマンドもこの URL を使う）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: make test
      - run: shellcheck install.sh
      - name: Build
        run: make build-linux VERSION="$GITHUB_REF_NAME"
      - name: Check the embedded version
        run: ./bin/shimamura-telemetry-linux-amd64 version | grep -F " $GITHUB_REF_NAME "
      - name: Prepare assets
        run: |
          mkdir dist
          cp bin/shimamura-telemetry-linux-amd64 bin/shimamura-telemetry-linux-arm64 install.sh dist/
          cd dist
          sha256sum shimamura-telemetry-linux-amd64 shimamura-telemetry-linux-arm64 > checksums.txt
          cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
